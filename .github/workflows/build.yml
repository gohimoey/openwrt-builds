name: OpenWrt KWRT 25.12 x86-64 Build

permissions:
  contents: write
  packages: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 file zstd

      - name: Download KWRT ImageBuilder
        run: |
          wget -q https://dl.openwrt.ai/releases/25.12/targets/x86/64/kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst
          tar --zstd -xf kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst --strip-components=1 -C .

      - name: Copy custom files
        run: |
          cp -r files-repo files

      - name: Remove static board.json
        run: |
          rm -f files/etc/board.json

      - name: Build firmware
        run: |
          make image PROFILE=generic PACKAGES="luci luci-ssl luci-theme-openwrt luci-proto-ipv6 luci-app-firewall luci-app-package-manager luci-mod-system luci-mod-network luci-mod-status luci-app-attendedsysupgrade luci-app-upnp luci-app-ddns luci-app-samba4 luci-app-tailscale-community tailscale luci-app-filebrowser luci-app-watchcat luci-app-sqm luci-app-nlbwmon luci-app-irqbalance luci-app-adguardhome adguardhome luci-app-mwan3 mwan3 luci-app-banip luci-app-commands luci-app-wol luci-app-uhttpd kmod-usb-core kmod-usb2 kmod-usb3 kmod-usb-xhci-hcd kmod-usb-ohci-pci kmod-usb-uhci kmod-fs-ext4 kmod-fs-ntfs3 kmod-fs-exfat kmod-fs-f2fs kmod-fs-hfsplus kmod-fs-btrfs kmod-usb-net kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8152 kmod-usb-net-cdc-ether kmod-usb-serial kmod-usb-serial-wwan kmod-usb-serial-option usb-modeswitch modemmanager kmod-e1000 kmod-e1000e kmod-igb kmod-igc kmod-r8169 kmod-ixgbevf kmod-vmxnet3 kmod-iwlwifi kmod-ath9k kmod-ath10k ip-full wpad-mbedtls wireless-tools iperf3 samba4-server aria2 curl htop nano bash tmux block-mount kmod-crypto-hash kmod-crypto-sha256 luci-app-openclash luci-app-passwall kmod-mt7921e kmod-mt7921-common kmod-mt7921-firmware kmod-mt7921s kmod-mt7921u kmod-mt7922-firmware kmod-mt792x-common kmod-mt792x-usb kmod-mt7615e kmod-mt7615-common kmod-mt7615-firmware kmod-mt7915e kmod-mt7915-firmware kmod-mt7916-firmware kmod-mt76x2 kmod-mt76x2-common kmod-mt76x02-usb kmod-mt76-core kmod-mt76-usb kmod-mhi-bus kmod-mhi-net kmod-mhi-wwan-ctrl kmod-mhi-wwan-mbim kmod-mhi-pci-generic kmod-qrtr-mhi kmod-usb-net-qmi-wwan kmod-usb-net-cdc-mbim kmod-usb-net-cdc-ncm kmod-qcom-qmi-helpers luci-proto-modemmanager luci-proto-qmi luci-proto-mbim uqmi libqmi qmi-utils parted gdisk blkid fdisk cfdisk smartmontools kmod-phy-broadcom" FILES=files/ BIN_DIR=bin IGNORE_ERRORS=m -j$(nproc) CONFIG_SQUASHFS_COMPRESSION=zstd CONFIG_SQUASHFS_ZSTD_LEVEL=1 CONFIG_SQUASHFS_ZSTD_THREADS=1 || true
          ls -la bin/targets/x86/64/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-firmware
          path: |
            bin/targets/x86/64/*.img*
            bin/targets/x86/64/*.iso*
            bin/targets/x86/64/*.tar.gz

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kwrt-25.12-${{ github.run_number }}
          name: KWRT 25.12 x86-64 Build ${{ github.run_number }}
          files: |
            bin/targets/x86/64/*.img*
            bin/targets/x86/64/*.iso*
            bin/targets/x86/64/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}